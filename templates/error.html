{% extends "layout.html" %}
{% block content %}
  <!-- Back link -->
  <div class="mb-6">
    <a href="{{ url_for('home') }}"
       class="inline-flex items-center gap-1.5 text-sm font-medium text-brand-600 dark:text-brand-400 hover:text-brand-700 dark:hover:text-brand-300 transition-colors duration-150">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Back to posts
    </a>
  </div>

  <article class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm p-8">
    <h1 class="font-heading font-bold text-3xl text-slate-900 dark:text-slate-50 leading-snug mb-4">
     Oops... 🤪 {{ status_code }} Error
    </h1>
    <hr class="border-slate-200 dark:border-slate-700 mb-6">
    <p class="text-slate-600 dark:text-slate-300 text-base leading-relaxed">{{ message }}</p>
  </article>
{% endblock content %}
