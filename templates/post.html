{% extends "layout.html" %}
{% block content %}
  <!-- Back link -->
  <div class="mb-6">
    <a href="{{ url_for('home') }}"
       class="inline-flex items-center gap-1.5 text-sm font-medium text-brand-600 dark:text-brand-400 hover:text-brand-700 dark:hover:text-brand-300 transition-colors duration-150">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Back to posts
    </a>
  </div>

  <!-- Post article -->
  <article class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm p-8">

    <!-- Author row -->
    <div class="flex items-center gap-4 mb-6">
      <img class="rounded-full flex-shrink-0 ring-2 ring-brand-200 dark:ring-brand-700 object-cover"
           src="{{ url_for('static', path='profile_pics/default.png') }}"
           alt="{{ post.author }}'s profile picture"
           width="52"
           height="52"
           loading="lazy">
      <div>
        <a href="#"
           class="text-sm font-semibold text-brand-600 dark:text-brand-400 hover:text-brand-700 dark:hover:text-brand-300 transition-colors duration-100">
          {{ post.author }}
        </a>
        <div class="mt-0.5">
          <time class="text-xs text-slate-400 dark:text-slate-500">{{ post.date_posted }}</time>
        </div>
      </div>
    </div>

    <!-- Title -->
    <h1 class="font-heading font-bold text-3xl text-slate-900 dark:text-slate-50 leading-snug mb-6">
      {{ post.title }}
    </h1>

    <!-- Divider -->
    <hr class="border-slate-200 dark:border-slate-700 mb-6">

    <!-- Body -->
    <div class="text-slate-700 dark:text-slate-300 text-base leading-relaxed space-y-4">
      <p>{{ post.content }}</p>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-3 mt-8 pt-6 border-t border-slate-200 dark:border-slate-700">
      <a href="/posts/{{ post.id }}/edit"
         class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium bg-brand-600 hover:bg-brand-700 text-white transition-colors duration-150">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
        </svg>
        Editar
      </a>

      <button type="button"
              class="inline-flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium bg-red-600 hover:bg-red-700 text-white transition-colors duration-150">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
        Excluir
      </button>
    </div>

  </article>
{% endblock content %}
