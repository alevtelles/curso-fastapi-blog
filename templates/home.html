{% extends "layout.html" %}
{% block content %}
  {% for post in posts %}
    <article class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-200 p-6 mb-6">
      <div class="flex items-start gap-4">

        <!-- Avatar -->
        <img class="rounded-full flex-shrink-0 ring-2 ring-brand-200 dark:ring-brand-700 object-cover"
             src="{{ url_for('static', path='profile_pics/default.png') }}"
             alt="{{ post.author }}'s profile picture"
             width="52"
             height="52"
             loading="lazy">

        <!-- Content -->
        <div class="flex-1 min-w-0">

          <!-- Meta -->
          <div class="flex flex-wrap items-center gap-x-2 gap-y-0.5 mb-2">
            <a href="#"
               class="text-sm font-semibold text-brand-600 dark:text-brand-400 hover:text-brand-700 dark:hover:text-brand-300 transition-colors duration-100">
              {{ post.author }}
            </a>
            <span class="text-slate-300 dark:text-slate-600 text-xs select-none">&bull;</span>
            <time class="text-xs text-slate-400 dark:text-slate-500">
              {{ post.date_posted }}
            </time>
          </div>

          <!-- Title -->
          <h2 class="font-heading font-bold text-xl text-slate-900 dark:text-slate-50 mb-2 leading-snug">
            <a href="{{ url_for('post', post_id=post.id) }}"
               class="hover:text-brand-600 dark:hover:text-brand-400 transition-colors duration-150">
              {{ post.title }}
            </a>
          </h2>

          <!-- Body -->
          <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed">
            {{ post.content }}
          </p>

          <!-- Footer action -->
          <div class="mt-4 flex items-center gap-3">
            <a href="{{ url_for('post', post_id=post.id) }}"
               class="inline-flex items-center gap-1.5 text-xs font-medium text-brand-600 dark:text-brand-400 hover:text-brand-700 dark:hover:text-brand-300 bg-brand-50 dark:bg-brand-900/30 hover:bg-brand-100 dark:hover:bg-brand-900/50 px-3 py-1.5 rounded-full transition-colors duration-150">
              Read more
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </a>
          </div>

        </div>
      </div>
    </article>
  {% endfor %}
{% endblock content %}
